<!-- Contact forms page text-->
<section class="form-page">

  <div class="form-container">

    <h1>Kontaktformulär</h1>
    <p>Fyll i formuläret så återkommer jag så snart som möjligt.</p>

    <form id="contactForm" class="form">

      <label>Namn</label>
      <input type="text" id="name" placeholder="Ditt namn">

      <label>Email</label>
      <input type="email" id="email" placeholder="diana.ganieva24@gmail.com">

      <label>Meddelande</label>
      <textarea id="message" placeholder="Skriv ditt meddelande..."></textarea>

      <button type="submit" class="cta-btn">Skicka</button>

      <p id="formMessage"></p>

    </form>

  </div>

</section>
